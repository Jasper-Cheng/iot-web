# 测试环境编排（可从本仓库直接 docker-compose -f docker-compose-test.yml up -d --build）
# iot-web 从本仓库构建并注入 VITE_MQTT_WS_URL，无需预构建镜像
version: '3.8'

services:
  # MySQL 数据库服务 - 测试环境
  mysql:
    image: mysql:8.0
    container_name: mysql_test
    ports:
      - "3337:3306"
    environment:
      MYSQL_ROOT_PASSWORD: admin123
      MYSQL_DATABASE: iot_test
      MYSQL_USER: admin
      MYSQL_PASSWORD: admin123
    volumes:
      - mysql_test_data:/var/lib/mysql
    networks:
      - test_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-padmin123"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Redis 缓存服务 - 测试环境
  redis:
    image: redis:7-alpine
    container_name: redis_test
    ports:
      - "6380:6379"
    command: redis-server --requirepass test123 --appendonly yes
    volumes:
      - redis_test_data:/data
    networks:
      - test_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "test123", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  # RabbitMQ 消息队列服务 - 测试环境
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: rabbitmq_test
    ports:
      - "5673:5672"
      - "15673:15672"
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: admin123
    volumes:
      - rabbitmq_test_data:/var/lib/rabbitmq
    networks:
      - test_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  # EMQX MQTT Broker 服务 - 测试环境
  emqx:
    image: emqx/emqx:5.8.3
    container_name: emqx_test
    ports:
      - "1884:1883"    # MQTT TCP
      - "8884:8083"    # MQTT WebSocket（EMQX 5 默认监听 8083，非 8081）
      - "18084:18083"  # Dashboard
    environment:
      EMQX_NODE_NAME: emqx@test_node
      EMQX_DASHBOARD__DEFAULT_USERNAME: admin
      EMQX_DASHBOARD__DEFAULT_PASSWORD: public
      EMQX_LOG__LEVEL: info
      EMQX_ALLOW_ANONYMOUS: "true"
    volumes:
      - emqx_test_data:/opt/emqx/data
    networks:
      - test_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/opt/emqx/bin/emqx_ctl", "status"]
      interval: 30s
      timeout: 10s
      retries: 3

  # FastIoT 应用服务 - 测试环境
  fastiot:
    image: jasper27/fastiot-test:test
    container_name: fastiot_test
    ports:
      - "8001:8000"
    environment:
      MYSQL_ROOT_PASSWORD: admin123
      MYSQL_DATABASE: iot_test
      MYSQL_USER: admin
      MYSQL_PASSWORD: admin123
      DATABASE_URL: mysql+aiomysql://admin:admin123@mysql:3306/iot_test
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DB: iot_test
      REDIS_PASSWORD: test123
      REDIS_URL: redis://redis:6379/1
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DB: 1
      RABBITMQ_USER: admin
      RABBITMQ_PASSWORD: admin123
      RABBITMQ_URL: amqp://admin:admin123@rabbitmq:5672//
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_MANAGEMENT_PORT: 15672
      EMQX_NODE_NAME: emqx@test_node
      EMQX_DASHBOARD_USERNAME: admin
      EMQX_DASHBOARD_PASSWORD: public
      EMQX_LOG_LEVEL: info
      EMQX_ALLOW_ANONYMOUS: "true"
      MQTT_HOST: emqx
      MQTT_EXTERNAL_HOST: 192.168.3.196
      MQTT_PORT: 1883
      MQTT_EXTERNAL_PORT: 1884
      MQTT_USERNAME: admin
      MQTT_PASSWORD: public
      MQTT_WS_PORT: 8083
      MQTT_WS_EXTERNAL_PORT: 8884
      EMQX_DASHBOARD_PORT: 18083
      EMQX_DASHBOARD_EXTERNAL_PORT: 18084
      HOST: 0.0.0.0
      PORT: 8000
      NODE_ENV: test
      DEBUG: "true"
      SECRET_KEY: oHzDog9_KtaDrOQ69XAgQXl1vbxDWaVVeqdCek-YXWM
      ACCESS_TOKEN_EXPIRE_MINUTES: 1440
      CELERY_BROKER_URL: amqp://admin:admin123@rabbitmq:5672//
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      TZ: Asia/Shanghai
      CORS_ORIGINS: '["http://localhost:3001","http://127.0.0.1:8001","http://localhost:3002","http://localhost:3003","http://localhost:8080","http://192.168.3.196:8080","http://localhost:9090","http://192.168.3.196:9090"]'
      MAX_FILE_SIZE: 10485760
      UPLOAD_DIR: /app/uploads
      API_BASE_URL: "http://192.168.3.196:8001"
    volumes:
      - fastiot_uploads:/app/uploads
      - ./test_logs:/app/logs
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      emqx:
        condition: service_started
    networks:
      - test_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # IOT-WEB 用户前端 - 后端与 MQTT 地址由下方 build.args 决定（构建时写入镜像）
  iot-web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # 测试环境：前端请求的后端 API 根地址（与 fastiot 暴露端口一致）
        VITE_API_BASE_URL: "http://192.168.3.196:8001/api"
        # 测试环境：MQTT WebSocket 地址（与 EMQX 暴露端口 8884:8083 一致）
        VITE_MQTT_WS_URL: "ws://192.168.3.196:8884/mqtt"
    image: jasper27/iot-web-test:test
    container_name: iot-web_test
    ports:
      - "8080:80"
    networks:
      - test_network
    depends_on:
      - fastiot
      - emqx
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3

  # IOT-ADMIN 管理后台界面
  iot-admin:
    image: jasper27/iot-admin-test:test
    container_name: iot-admin_test
    ports:
      - "9090:90"
    environment:
      REACT_APP_API_URL: "http://192.168.3.196:8001/api"
      REACT_APP_ADMIN_API_URL: "http://192.168.3.196:8001/admin"
      REACT_APP_ENV: "test"
      REACT_APP_PROXY_TARGET: "http://fastiot:8000"
      PORT: 90
    networks:
      - test_network
    depends_on:
      - fastiot
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:90"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  mysql_test_data:
    name: mysql_test_data
  redis_test_data:
    name: redis_test_data
  rabbitmq_test_data:
    name: rabbitmq_test_data
  emqx_test_data:
    name: emqx_test_data
  fastiot_uploads:
    name: fastiot_test_uploads

networks:
  test_network:
    name: test_network
    driver: bridge
