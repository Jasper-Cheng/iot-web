name: Build and Push Docker Image

on:
  push:
    branches:
      - main
      - test
    tags:
      - "v*"

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      # 1 checkout
      - name: Checkout code
        uses: actions/checkout@v4

      # 2 识别环境
      - name: Determine environment
        id: env
        run: |
          if [[ "${GITHUB_REF}" == refs/heads/main ]]; then
            ENVIRONMENT="production"
            BRANCH="main"
            REPOSITORY="${{ secrets.Docker_REPOSITORY }}"
          elif [[ "${GITHUB_REF}" == refs/heads/test ]]; then
            ENVIRONMENT="test"
            BRANCH="test"
            REPOSITORY="${{ secrets.Docker_REPOSITORY_TEST }}"
          else
            ENVIRONMENT="production"
            BRANCH="main"
            REPOSITORY="${{ secrets.Docker_REPOSITORY }}"
          fi

          echo "environment=$ENVIRONMENT" >> $GITHUB_OUTPUT
          echo "branch=$BRANCH" >> $GITHUB_OUTPUT
          echo "repository=$REPOSITORY" >> $GITHUB_OUTPUT

      # 3 生成 tag
      - name: Generate tags
        id: tags
        run: |
          IMAGE="${{ steps.env.outputs.repository }}"
          BRANCH="${{ steps.env.outputs.branch }}"
          SHORT_SHA=$(echo $GITHUB_SHA | cut -c1-7)

          TAGS="$IMAGE:$BRANCH,$IMAGE:$SHORT_SHA"

          if [[ "$BRANCH" == "main" ]]; then
            TAGS="$TAGS,$IMAGE:latest"
          fi

          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            VERSION=${GITHUB_REF#refs/tags/v}
            TAGS="$TAGS,$IMAGE:$VERSION"
          fi

          echo "tags=$TAGS" >> $GITHUB_OUTPUT

      # 4 登录 DockerHub
      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.Docker_USERNAME }}
          password: ${{ secrets.Docker_PASSWORD }}

      # 5 支持 ARM 构建
      - name: Setup QEMU
        uses: docker/setup-qemu-action@v3

      # 6 buildx
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 7 构建并 push（多架构 + cache）
      - name: Build and Push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          platforms: linux/amd64,linux/arm64
          build-args: |
            ENVIRONMENT=${{ steps.env.outputs.environment }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 8 输出日志
      - name: Build Info
        run: |
          echo "Environment: ${{ steps.env.outputs.environment }}"
          echo "Branch: ${{ steps.env.outputs.branch }}"
          echo "Repository: ${{ steps.env.outputs.repository }}"
          echo "Tags: ${{ steps.tags.outputs.tags }}"
          echo "Commit: ${GITHUB_SHA:0:7}"
