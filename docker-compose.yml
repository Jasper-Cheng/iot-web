version: "3.9"

services:
  web:
    image: jasper27/iot-web:latest  # 改为 Docker Hub 名称
    build:
      context: .
      dockerfile: Dockerfile
    container_name: iot-web          # 容器名也可以改一下
    ports:
      - "8080:80"
    restart: always
    extra_hosts:
      - "host.docker.internal:host-gateway"